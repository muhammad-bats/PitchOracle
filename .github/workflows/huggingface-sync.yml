name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            git push --force https://muhammad-ml-bats:$HF_TOKEN@huggingface.co/spaces/muhammad-ml-bats/pitchoracle main
          else
            echo "HF_TOKEN secret is not set yet in GitHub repository secrets. Skipping auto-sync."
          fi
