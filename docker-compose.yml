version: "3.8"

services:
  pitchoracle:
    build:
      context: .
      dockerfile: Dockerfile
    image: pitchoracle:latest
    container_name: pitchoracle_app
    ports:
      - "7860:7860"
    environment:
      - PORT=7860
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
